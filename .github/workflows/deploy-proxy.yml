name: Deploy proxy

on:
  push:
    branches: [master]
    paths:
      - 'packages/proxy/src/**'
      - 'packages/proxy/wrangler.jsonc'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

# The newest master is the one to deploy, and the Worker upload is a single API call
concurrency:
  group: proxy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Holds the Cloudflare secrets and deploys only from master
    environment: cloudflare
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm --filter @frc-dev-wasm/proxy test
      - run: pnpm --filter @frc-dev-wasm/proxy run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
